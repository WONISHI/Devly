name: Checks and desktop build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: windows-2022
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: pnpm
      - name: Install locked dependencies and rebuild native modules
        run: pnpm install --frozen-lockfile
      - name: Check types, lint, format, contracts and production bundle
        run: pnpm check
      - name: Check SQLite and PTY in Electron runtime
        run: pnpm verify:native
      - name: Check persistent data and OS credential backend
        run: pnpm verify:persistence
      - name: Check development desktop
        run: pnpm verify:desktop
      - name: Check Provider UI and local HTTP protocol fixture (not a real supplier)
        run: pnpm verify:provider
      - name: Check startup and Provider entry without Codex
        run: pnpm verify:no-codex
      - name: Check project persistence and system credential backend
        run: pnpm verify:persistence
      - name: Build unsigned application directory
        run: pnpm exec electron-builder --dir --config.electronDist=node_modules/electron/dist
      - name: Check packaged macOS desktop
        if: runner.os == 'macOS'
        run: pnpm verify:desktop
        env:
          DEVLY_EXECUTABLE: release/mac-arm64/Devly.app/Contents/MacOS/Devly
      - name: Check packaged Windows desktop
        if: runner.os == 'Windows'
        run: pnpm verify:desktop
        env:
          DEVLY_EXECUTABLE: release/win-unpacked/Devly.exe
      - name: Retain screenshots and unsigned build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            output/*.png
            release/builder-*.yaml
          if-no-files-found: ignore
