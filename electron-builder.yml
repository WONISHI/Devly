appId: com.devly.desktop
productName: Devly
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/vendor
    to: licenses
    filter:
      - stage10-*
      - stage11-*
      - stage12-*
      - ansi-to-react.NOTICE
      - BSD-3-Clause.LICENSE
      - anser.LICENSE
      - escape-carriage.LICENSE
      - linkify-it.LICENSE
      - uc-micro.LICENSE
      - radix-use-controllable-state.LICENSE
      - xterm.LICENSE
      - xterm-addon-fit.LICENSE
  - from: node_modules/monaco-editor/LICENSE
    to: licenses/monaco-editor.LICENSE
  - from: node_modules/@monaco-editor/react/LICENSE
    to: licenses/monaco-react.LICENSE
  - from: resources/vendor/monaco-loader.LICENSE
    to: licenses/monaco-loader.LICENSE
  - from: node_modules/ignore/LICENSE-MIT
    to: licenses/ignore.LICENSE
  - from: src/renderer/src/components/ai-elements/LICENSE
    to: licenses/ai-elements.LICENSE
  - from: build/icon.png
    to: icon.png
  - from: resources/vendor/lobe-icons.LICENSE
    to: licenses/lobe-icons.LICENSE
  - from: resources/vendor/motion.LICENSE
    to: licenses/motion.LICENSE
  - from: resources/vendor/framer-motion.LICENSE
    to: licenses/framer-motion.LICENSE
  - from: resources/vendor/motion-dom.LICENSE
    to: licenses/motion-dom.LICENSE
  - from: resources/vendor/motion-utils.LICENSE
    to: licenses/motion-utils.LICENSE
asarUnpack:
  - '**/*.node'
  - node_modules/node-pty/**
mac:
  icon: build/icon.icns
  target: dmg
  category: public.app-category.developer-tools
win:
  icon: build/icon.png
  target: nsis
linux:
  icon: build/icon.png
  target: AppImage
